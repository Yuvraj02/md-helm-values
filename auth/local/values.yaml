# Local Kind overrides for md-charts/auth.
# Sourced from backend/services/auth-service/deployments/k8s.yaml
# (adapted for Kind + chart schema). Migrate Job is not in the Helm chart.
#
# Secrets: create Secret "auth-service-secrets" with key DATABASE_PASSWORD manually.
# DATABASE_HOST must resolve from the cluster (in-cluster Service or Kind→host networking).

fullnameOverride: auth-service

replicaCount: 1

image:
  repository: marketing-digest-auth-service
  tag: latest
  pullPolicy: IfNotPresent

containerPort: 50051

service:
  port: 50051
  targetPort: 50051

livenessProbe:
  grpc:
    port: 50051
  initialDelaySeconds: 10
  periodSeconds: 20

readinessProbe:
  grpc:
    port: 50051
  initialDelaySeconds: 3
  periodSeconds: 5

env:
  - name: APP_ENV
    value: development
  - name: SERVICE_NAME
    value: auth-service
  - name: GRPC_PORT
    value: "50051"
  - name: DATABASE_HOST
    value: auth-postgres
  - name: DATABASE_PORT
    value: "5432"
  - name: DATABASE_NAME
    value: marketing_digest_auth
  - name: DATABASE_USER
    value: auth
  - name: DATABASE_SSLMODE
    value: disable
  - name: SHUTDOWN_TIMEOUT
    value: 15s

envFrom:
  - secretRef:
      name: auth-service-secrets
