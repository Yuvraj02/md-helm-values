# Local Kind overrides for md-charts/gateway.
# Non-secret settings aligned with backend/gateway/.env.
# gRPC addrs use in-cluster Service DNS (not host localhost).
# OWNER_STUDIO_SECRET comes from Secret gateway-secrets (not Git).

fullnameOverride: gateway

replicaCount: 1

image:
  repository: md-local-registry:5000/marketing-digest/gateway
  tag: local
  pullPolicy: IfNotPresent

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

env:
  - name: APP_ENV
    value: development
  - name: HTTP_PORT
    value: "8080"
  - name: SHUTDOWN_TIMEOUT
    value: 15s
  - name: AUTH_SERVICE_GRPC_ADDR
    value: auth-service:50051
  - name: BLOG_SERVICE_GRPC_ADDR
    value: blog-service:50052
  - name: CORS_ALLOWED_ORIGINS
    value: "*"
  - name: OWNER_STUDIO_SECRET
    valueFrom:
      secretKeyRef:
        name: gateway-secrets
        key: OWNER_STUDIO_SECRET
