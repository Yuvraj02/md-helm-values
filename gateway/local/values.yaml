# Local Kind overrides for md-charts/gateway.
# Sourced from backend/gateway/deployments/k8s.yaml (adapted for Kind + chart schema).
# Secrets: create Secret "gateway-secrets" with key OWNER_STUDIO_SECRET manually.

fullnameOverride: gateway

replicaCount: 1

image:
  repository: marketing-digest-gateway
  tag: latest
  pullPolicy: IfNotPresent

# Chart default service.port is 8080 (ClusterIP behind LB later).
# k8s.yaml used Service port 80; not used for local Kind.

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

env:
  - name: APP_ENV
    value: development
  - name: HTTP_PORT
    value: "8080"
  - name: AUTH_SERVICE_GRPC_ADDR
    value: auth-service:50051
  - name: BLOG_SERVICE_GRPC_ADDR
    value: blog-service:50051
  - name: CORS_ALLOWED_ORIGINS
    value: "*"
  - name: SHUTDOWN_TIMEOUT
    value: 15s
  - name: OWNER_STUDIO_SECRET
    valueFrom:
      secretKeyRef:
        name: gateway-secrets
        key: OWNER_STUDIO_SECRET
