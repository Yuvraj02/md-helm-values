# Production overrides for md-charts/gateway.
# image.tag is bumped by Jenkins after image push; Argo CD syncs (no DB migration).

fullnameOverride: gateway

replicaCount: 1

image:
  repository: 095466867304.dkr.ecr.ap-south-1.amazonaws.com/marketing-digest/gateway
  tag: "7df8a527"
  pullPolicy: IfNotPresent

env:
  - name: APP_ENV
    value: production
  - name: HTTP_PORT
    value: "8080"
  - name: SHUTDOWN_TIMEOUT
    value: 15s
  - name: AUTH_SERVICE_GRPC_ADDR
    value: auth-service:50051
  - name: BLOG_SERVICE_GRPC_ADDR
    value: blog-service:50051
  - name: CORS_ALLOWED_ORIGINS
    value: "*"
  - name: OWNER_STUDIO_SECRET
    valueFrom:
      secretKeyRef:
        name: gateway-secrets
        key: OWNER_STUDIO_SECRET
