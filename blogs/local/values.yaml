# Local Kind overrides for md-charts/blogs.
# Non-secret settings aligned with backend/services/blog-service/.env.
# DATABASE_HOST: Kind pods cannot use "localhost" for host Postgres; 172.18.0.1
# is the kind Docker bridge gateway to the host (where .env uses localhost:5432).
#
# Secrets stay out of Git — see Secret blog-service-secrets in cluster.

fullnameOverride: blog-service

replicaCount: 1

image:
  repository: md-local-registry:5000/marketing-digest/blogs
  tag: local
  pullPolicy: IfNotPresent

containerPort: 50052

service:
  port: 50052
  targetPort: 50052

livenessProbe:
  grpc:
    port: 50052
  initialDelaySeconds: 10
  periodSeconds: 20

readinessProbe:
  grpc:
    port: 50052
  initialDelaySeconds: 3
  periodSeconds: 5

env:
  - name: APP_ENV
    value: development
  - name: SERVICE_NAME
    value: blog-service
  - name: GRPC_PORT
    value: "50052"
  - name: SHUTDOWN_TIMEOUT
    value: 15s
  - name: DATABASE_HOST
    value: "172.18.0.1"
  - name: DATABASE_PORT
    value: "5432"
  - name: DATABASE_NAME
    value: marketing_digest_blog
  - name: DATABASE_USER
    value: marketing_digest
  - name: DATABASE_SSLMODE
    value: disable
  - name: DB_MAX_OPEN_CONNS
    value: "25"
  - name: DB_MAX_IDLE_CONNS
    value: "5"
  - name: DB_CONN_MAX_LIFETIME
    value: 30m

envFrom:
  - secretRef:
      name: blog-service-secrets
